name: 打包 Windows 绿色版

on:
  workflow_dispatch:          # 在仓库的 Actions 页面手动点「Run workflow」
  push:
    tags:
      - "v*"                  # 推送形如 v1.6.0 的标签时自动打包并发布到 Releases

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装打包工具
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller segno pystray pillow

      - name: 准备入口脚本并读取版本号
        shell: pwsh
        run: |
          if (Test-Path "msub.py") { Copy-Item msub.py build_entry.py }
          elseif (Test-Path "msub") { Copy-Item msub build_entry.py }
          else { throw "仓库根目录里找不到 msub 或 msub.py" }
          $m = Select-String -Path build_entry.py -Pattern '^VERSION = "([^"]+)"' | Select-Object -First 1
          if (-not $m) { throw "没有在脚本里找到 VERSION" }
          $ver = $m.Matches[0].Groups[1].Value
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "版本号: $ver"

      - name: 生成程序图标
        shell: pwsh
        env:
          MSUB_HOME: ${{ runner.temp }}\msub-icon
        run: |
          python -c "import build_entry as m; m.make_tray_image(256).save('msub.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(256,256)])"
          if (-not (Test-Path msub.ico)) { throw "图标生成失败" }

      - name: 打包
        shell: pwsh
        run: |
          Copy-Item windows/msub.spec msub.spec
          pyinstaller --noconfirm --clean msub.spec

      - name: 自检（控制台版：启动服务、登录、添加节点、读取各种订阅、检查托盘组件）
        shell: pwsh
        env:
          MSUB_HOME: ${{ runner.temp }}\msub-selftest
        run: |
          & ./dist/msub/msub-console.exe selftest
          if ($LASTEXITCODE -ne 0) { throw "打包后的程序自检失败，请查看上面的输出" }

      - name: 冒烟测试（窗口版 msub.exe 能启动并提供管理页面）
        shell: pwsh
        env:
          MSUB_HOME: ${{ runner.temp }}\msub-smoke
          MSUB_NO_WINDOW: "1"
        run: |
          $p = Start-Process -FilePath ./dist/msub/msub.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try {
              $cfg = Get-Content "$env:MSUB_HOME\config.json" -Raw | ConvertFrom-Json
              $r = Invoke-WebRequest -UseBasicParsing -Uri ("http://127.0.0.1:{0}/admin" -f $cfg.web.port) -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            if ($p.HasExited) { break }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (Test-Path "$env:MSUB_HOME\msub.log") { Write-Host "---- msub.log ----"; Get-Content "$env:MSUB_HOME\msub.log" }
          if (-not $ok) { throw "窗口版 msub.exe 没有在预期时间内提供管理页面，请查看上面的日志" }

      - name: 生成压缩包
        shell: pwsh
        run: |
          Copy-Item windows/README.txt dist/msub/README.txt
          $zip = "msub-windows-v$env:APP_VERSION.zip"
          Compress-Archive -Path dist/msub -DestinationPath $zip -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $zip | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: msub-windows
          path: ${{ env.ZIP_NAME }}

      - name: 发布到 Releases（仅标签触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
